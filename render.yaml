# Render Blueprint for the backend. The frontend is deployed separately on
# Vercel (see vercel.json), so this file only describes the API service.
#
# Import it from the Render dashboard: New > Blueprint > pick this repo.
# The service runs the Docker image, not Render's node runtime. semgrep is a
# Python program: on the node runtime Render provisions Python for the build
# only, outside the project directory, so a venv built there has its
# interpreter symlink dangle at runtime and the dataflow step can never run.
# The image has semgrep installed and version-checked at build time.
services:
  - type: web
    name: codebase-ai-api
    runtime: docker
    plan: free
    dockerfilePath: ./docker/api.Dockerfile
    # The Dockerfile copies apps/api and the workspace manifests, so the build
    # context has to be the repository root.
    dockerContext: .
    # The image's CMD is just `node dist/index.js`. Migrations ran in the old
    # buildCommand and have nowhere else to go: preDeployCommand needs a paid
    # instance type, so they run here, before the server starts.
    dockerCommand: sh -c "/app/node_modules/.bin/prisma migrate deploy && node dist/index.js"
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      # Render injects PORT; env.ts binds to it automatically.
      - key: SESSION_SECRET
        generateValue: true
      # Postgres connection string (needs the pgvector extension).
      - key: DATABASE_URL
        sync: false
      # Exactly 64 hex characters: `openssl rand -hex 32`.
      - key: ENCRYPTION_KEY
        sync: false
      # The Vercel frontend origin, no trailing slash. Comma separated for
      # extra allowed origins; the first one is used for OAuth redirects.
      - key: WEB_ORIGIN
        sync: false
      # https://<this-service>.onrender.com/api/github/callback
      - key: GITHUB_CALLBACK_URL
        sync: false
      - key: GITHUB_CLIENT_ID
        sync: false
      - key: GITHUB_CLIENT_SECRET
        sync: false
      # GitHub App. Preferred over the OAuth/token flow: installation tokens
      # are short-lived and scoped to the repositories the user granted.
      # GITHUB_APP_PRIVATE_KEY must be the PEM on a single line with escaped
      # newlines - the config loader reads .env line by line.
      - key: GITHUB_APP_ID
        sync: false
      - key: GITHUB_APP_SLUG
        sync: false
      - key: GITHUB_APP_PRIVATE_KEY
        sync: false
      # Optional. The App authenticates with a JWT and installation tokens, so
      # nothing reads these today - they exist for a future user-OAuth flow.
      - key: GITHUB_APP_CLIENT_ID
        sync: false
      - key: GITHUB_APP_CLIENT_SECRET
        sync: false
      - key: GITHUB_WEBHOOK_SECRET
        sync: false
      - key: AI_PROVIDER
        sync: false
      - key: AI_API_KEY
        sync: false
      - key: AI_MODEL
        sync: false
      # The architecture report is a large JSON document: a 4000-character
      # summary, a 6000-character diagram and up to 40 directory entries. The
      # 4096 default truncates it mid-document, which is not valid JSON, so the
      # whole narrative is discarded.
      - key: AI_MAX_OUTPUT_TOKENS
        value: "16384"
      # The queue is in-process, so the API must run its own jobs. Setting this
      # false here accepts analyses and never runs them.
      - key: WORKER_ENABLED
        value: "true"
      # Dependency scanning against OSV.dev - public API, no key needed.
      - key: SCA_ENABLED
        value: "true"
      # Dataflow analysis. The build above installs semgrep into .venv; if that
      # ever fails the binary is absent and the step skips itself cleanly.
      - key: SEMGREP_ENABLED
        value: "true"
      # Installed globally in the image, so the plain name resolves.
      - key: SEMGREP_PATH
        value: semgrep
