# Render Blueprint for the backend. The frontend is deployed separately on
# Vercel (see vercel.json), so this file only describes the API service.
#
# Import it from the Render dashboard: New > Blueprint > pick this repo.
# It pins the build and start commands together, which keeps them from drifting
# apart in the dashboard (a web-only build command plus `npm run start:api`
# is what produced "Cannot find module .../apps/api/dist/index.js").
services:
  - type: web
    name: codebase-ai-api
    runtime: node
    plan: free
    # Build from the repo root so npm workspaces resolve; `build:api` runs
    # `prisma generate` and compiles apps/api/src -> apps/api/dist.
    # Migrations run here because preDeployCommand needs a paid instance type.
    #
    # semgrep is a Python program and this is the node runtime, so it is built
    # into a venv under the project directory - the only path Render carries
    # from build to runtime. SEMGREP_PATH below points at it. The install is
    # allowed to fail: a pip hiccup should cost the dataflow step, not the
    # deploy, and the skipped step records why. Keep the version in step with
    # docker/api.Dockerfile.
    buildCommand: >-
      (python3 -m venv .venv && .venv/bin/pip install --no-cache-dir semgrep==1.175.0)
      || echo 'semgrep unavailable, the dataflow step will skip';
      npm ci && npm run db:deploy && npm run build:api
    startCommand: npm run start:api
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      # Render injects PORT; env.ts binds to it automatically.
      - key: SESSION_SECRET
        generateValue: true
      # Postgres connection string (needs the pgvector extension).
      - key: DATABASE_URL
        sync: false
      # Exactly 64 hex characters: `openssl rand -hex 32`.
      - key: ENCRYPTION_KEY
        sync: false
      # The Vercel frontend origin, no trailing slash. Comma separated for
      # extra allowed origins; the first one is used for OAuth redirects.
      - key: WEB_ORIGIN
        sync: false
      # https://<this-service>.onrender.com/api/github/callback
      - key: GITHUB_CALLBACK_URL
        sync: false
      - key: GITHUB_CLIENT_ID
        sync: false
      - key: GITHUB_CLIENT_SECRET
        sync: false
      # GitHub App. Preferred over the OAuth/token flow: installation tokens
      # are short-lived and scoped to the repositories the user granted.
      # GITHUB_APP_PRIVATE_KEY must be the PEM on a single line with escaped
      # newlines - the config loader reads .env line by line.
      - key: GITHUB_APP_ID
        sync: false
      - key: GITHUB_APP_SLUG
        sync: false
      - key: GITHUB_APP_PRIVATE_KEY
        sync: false
      # Optional. The App authenticates with a JWT and installation tokens, so
      # nothing reads these today - they exist for a future user-OAuth flow.
      - key: GITHUB_APP_CLIENT_ID
        sync: false
      - key: GITHUB_APP_CLIENT_SECRET
        sync: false
      - key: GITHUB_WEBHOOK_SECRET
        sync: false
      - key: AI_PROVIDER
        sync: false
      - key: AI_API_KEY
        sync: false
      - key: AI_MODEL
        sync: false
      # The queue is in-process, so the API must run its own jobs. Setting this
      # false here accepts analyses and never runs them.
      - key: WORKER_ENABLED
        value: "true"
      # Dependency scanning against OSV.dev - public API, no key needed.
      - key: SCA_ENABLED
        value: "true"
      # Dataflow analysis. The build above installs semgrep into .venv; if that
      # ever fails the binary is absent and the step skips itself cleanly.
      - key: SEMGREP_ENABLED
        value: "true"
      - key: SEMGREP_PATH
        value: /opt/render/project/src/.venv/bin/semgrep
