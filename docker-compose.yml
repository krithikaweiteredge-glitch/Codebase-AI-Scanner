services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: codebase-ai-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: codebase
      POSTGRES_PASSWORD: codebase
      POSTGRES_DB: codebase_ai
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U codebase -d codebase_ai"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    container_name: codebase-ai-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    container_name: codebase-ai-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://codebase:codebase@postgres:5432/codebase_ai?schema=public
      API_PORT: "4000"
      WORKER_ENABLED: "false"
    ports:
      - "4000:4000"

  worker:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    container_name: codebase-ai-worker
    restart: unless-stopped
    command: ["node", "dist/worker.js"]
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://codebase:codebase@postgres:5432/codebase_ai?schema=public

  web:
    build:
      context: .
      dockerfile: docker/web.Dockerfile
    container_name: codebase-ai-web
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "5173:80"

volumes:
  postgres_data:
